<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle for contrast on light/dark mode browser tabs -->
  <rect width="256" height="256" rx="64" fill="#0b0f19" />
  <!-- Sliced Play Button -->
  <path d="M60 50 L115 128 L60 206 Z" fill="url(#pinkGrad)" filter="url(#neonGlow)" />
  <path d="M130 128 L200 128 L130 50 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)" />
  <path d="M130 206 L200 128 L130 128 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)" opacity="0.8" />
  <!-- Scissors Cutting Slash -->
  <line x1="122" y1="30" x2="122" y2="226" stroke="#ffffff" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>